<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080507" />
  <title>Aira Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Live2D Cubism Core, PixiJS v6, & pixi-live2d-display -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
  <style>
    :root {
      --bg-void: #080507;
      --crimson: #d90429;
      --crimson-glow: rgba(217, 4, 41, 0.55);
      --gold: #e0b84c;
      --gold-dim: rgba(224, 184, 76, 0.24);
      --glass: rgba(18, 10, 14, 0.84);
      --text-main: #f8f2f4;
      --text-muted: #9e8a92;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 35%, #2b0610 0%, #120408 48%, var(--bg-void) 88%);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    #bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* SIDEBAR RIWAYAT SESI (KIRI) */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 30;
      display: none;
    }
    .sidebar-backdrop.open { display: block; }

    aside#history-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 82vw;
      background: #0e070a;
      border-right: 1px solid var(--gold-dim);
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
    }
    aside#history-drawer.open { transform: translateX(0); }

    /* KOTAK RIWAYAT CHAT PER SESI (GESER DARI KANAN KE KIRI) */
    .right-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(3px);
      z-index: 32;
      display: none;
    }
    .right-drawer-backdrop.open { display: block; }

    aside#right-chat-drawer {
      position: fixed;
      top: 58px;
      right: 0;
      bottom: 76px;
      width: 272px;
      max-width: 78vw;
      background: rgba(14, 7, 10, 0.94);
      border: 1px solid var(--gold-dim);
      border-right: none;
      border-radius: 20px 0 0 20px;
      z-index: 36;
      transform: translateX(100%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: 12px;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.7);
      touch-action: pan-y;
    }
    aside#right-chat-drawer.dragging {
      transition: none;
    }
    aside#right-chat-drawer.open {
      transform: translateX(0);
    }

    .right-drawer-handle {
      position: absolute;
      left: -26px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 68px;
      border-radius: 14px 0 0 14px;
      border: 1px solid var(--gold-dim);
      border-right: none;
      background: rgba(24, 10, 16, 0.92);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      font-size: 0.8rem;
      box-shadow: -4px 0 14px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    .right-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.76rem;
      color: var(--gold);
      font-weight: 500;
    }

    .right-drawer-close {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(224, 184, 76, 0.25);
      color: var(--text-main);
      border-radius: 8px;
      padding: 2px 7px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .session-chat-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .chat-bubble-item {
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .chat-bubble-item.user {
      background: rgba(217, 4, 41, 0.22);
      border: 1px solid rgba(217, 4, 41, 0.38);
      color: #ffe5ec;
      align-self: flex-end;
      max-width: 92%;
    }
    .chat-bubble-item.ai {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(224, 184, 76, 0.2);
      color: var(--text-main);
      align-self: flex-start;
      max-width: 95%;
    }
    .chat-bubble-role {
      display: block;
      font-size: 0.64rem;
      color: var(--gold);
      margin-bottom: 2px;
      opacity: 0.85;
    }

    .new-chat-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--gold-dim);
      background: linear-gradient(135deg, rgba(217, 4, 41, 0.22), rgba(20, 10, 14, 0.9));
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .drawer-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--gold);
      opacity: 0.8;
      margin-bottom: 8px;
      padding-left: 6px;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: 0.2s;
    }
    .session-item.active, .session-item:hover {
      background: rgba(217, 4, 41, 0.16);
      border-color: rgba(217, 4, 41, 0.4);
      color: var(--text-main);
    }

    .drawer-footer {
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .account-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      font-size: 0.78rem;
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .account-info img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--gold);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(217,4,41,0.4);
      color: #ff758f;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* HEADER */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      z-index: 12;
      gap: 6px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--gold-dim);
      background: var(--glass);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      overflow: hidden;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 1.6px;
    }

    .pill-group {
      display: flex;
      background: var(--glass);
      padding: 3px;
      border-radius: 99px;
      border: 1px solid var(--gold-dim);
      backdrop-filter: blur(10px);
    }

    .pill-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.66rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 99px;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill-tab.active {
      background: linear-gradient(135deg, var(--crimson), #9b031e);
      color: #fff;
      box-shadow: 0 0 10px var(--crimson-glow);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-toggle.muted {
      opacity: 0.65;
      color: var(--text-muted);
    }

    .google-avatar-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: var(--glass);
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
    }
    .google-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* WORKSPACE UTAMA (SELALU DI DEPAN LIVE2D) */
    .workspace {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 16px;
      gap: 14px;
      z-index: 6;
      overflow: hidden;
      pointer-events: none;
    }

    body.mode-live2d .workspace {
      justify-content: flex-end;
      padding-bottom: 8px;
    }

    @media (orientation: landscape) and (min-width: 768px) {
      .workspace,
      body.mode-live2d .workspace {
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        padding: 10px 32px;
      }
      .stage-col { flex: 0 0 auto; min-width: 260px; }
      .chat-col { flex: 1; max-width: 460px; }
    }

    .stage-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #zafkiel-stage {
      position: relative;
      width: min(250px, 60vw);
      height: min(250px, 60vw);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .clock-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--gold-dim);
      box-shadow: 0 0 50px rgba(217, 4, 41, 0.22), inset 0 0 30px rgba(217, 4, 41, 0.16);
      animation: rotateClockwise 48s linear infinite;
    }

    .clock-inner {
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      border: 1.5px dashed rgba(224, 184, 76, 0.45);
      animation: rotateCounter 32s linear infinite;
    }

    .roman-num {
      position: absolute;
      width: 24px;
      height: 18px;
      text-align: center;
      line-height: 18px;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: var(--gold);
      opacity: 0.88;
      animation: rotateCounter 48s linear infinite;
    }

    .avatar-core {
      position: relative;
      width: 56%;
      height: 56%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #c40828 0%, #520413 65%, #1c0207 100%);
      border: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 36px var(--crimson-glow), inset 0 0 22px rgba(0,0,0,0.75);
      transition: transform 0.06s ease-out, box-shadow 0.08s ease-out;
    }

    .avatar-core.idle-heartbeat {
      animation: idleHeart 2.8s infinite ease-in-out;
    }

    .avatar-core.listening {
      border-color: var(--gold);
      box-shadow: 0 0 38px rgba(224, 184, 76, 0.45);
    }

    .core-emblem {
      font-family: 'Cinzel', serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--gold);
    }

    .wave-bars {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 16px;
      margin-top: 6px;
    }

    .wave-bars span {
      width: 3px;
      height: 5px;
      background: var(--gold);
      border-radius: 99px;
      transition: height 0.08s ease;
    }

    .avatar-core.listening .wave-bars span {
      animation: waveDance 0.55s infinite ease-in-out alternate;
    }

    /* LIVE2D FULL-SCREEN LAYER (DI BELAKANG KOTAK TEKS) */
    #live2d-stage {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      border-radius: 0;
      background: transparent;
      pointer-events: auto;
      z-index: 1;
      align-items: center;
      justify-content: center;
    }

    #live2d-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .live2d-placeholder {
      z-index: 2;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      padding: 16px;
    }

    .live2d-placeholder strong {
      display: block;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .chat-col {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      position: relative;
      z-index: 8;
    }

    /* KOTAK PESAN USER (BERKOTAK KACA SERASI) */
    #user-transcript {
      font-size: 0.76rem;
      color: #ffe5ec;
      margin-bottom: 8px;
      max-width: 92%;
      padding: 6px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(45, 10, 20, 0.85), rgba(16, 7, 11, 0.92));
      border: 1px solid rgba(217, 4, 41, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      text-align: center;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      word-break: break-word;
    }

    #user-transcript.visible {
      display: inline-flex;
    }

    .rec-badge {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(224, 184, 76, 0.14);
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-size: 0.66rem;
      letter-spacing: 0.5px;
    }
    .rec-badge.active {
      display: inline-flex;
    }
    .rec-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: recBlink 0.9s infinite ease-in-out;
    }

    /* KOTAK SUBTITLE + STATUS MENYATU */
    .subtitle-card {
      width: 100%;
      max-height: 24dvh;
      overflow-y: auto;
      background: linear-gradient(180deg, rgba(28, 12, 18, 0.86), rgba(10, 5, 8, 0.94));
      border: 1px solid rgba(224, 184, 76, 0.28);
      border-radius: 20px;
      padding: 10px 16px 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.72);
      text-align: center;
    }

    .status-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 2px 10px;
      margin-bottom: 8px;
      border-radius: 99px;
      background: rgba(224, 184, 76, 0.1);
      border: 1px solid rgba(224, 184, 76, 0.22);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    #state-text {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
    }

    #aira-subtitle {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text-main);
      text-align: center;
    }

    #aira-speech-sub {
      font-size: 0.74rem;
      color: var(--gold);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      display: none;
    }

    #vision-box {
      position: fixed;
      top: 64px;
      right: 16px;
      width: 96px;
      height: 128px;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid var(--gold);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
      display: none;
      background: #000;
      z-index: 15;
    }
    #vision-box video { width: 100%; height: 100%; object-fit: cover; }

    footer {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 18px;
      z-index: 12;
      position: relative;
    }

    .unified-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 9, 13, 0.92);
      border: 1px solid var(--gold-dim);
      border-radius: 99px;
      padding: 5px 6px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
    }

    .bar-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .bar-icon svg, .mic-compact svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bar-icon.active {
      background: rgba(217, 4, 41, 0.28);
      color: #ff758f;
    }

    .unified-bar input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.85rem;
      padding: 0 6px;
      outline: none;
    }
    .unified-bar input::placeholder { color: var(--text-muted); }

    .mic-compact {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .mic-compact.listening {
      background: rgba(224, 184, 76, 0.18);
      color: var(--gold);
      box-shadow: 0 0 0 2px rgba(224, 184, 76, 0.35);
    }

    .send-compact {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #stop-btn {
      display: none;
      background: rgba(217, 4, 41, 0.25);
      color: #ff6b81;
    }
    #stop-btn.visible { display: flex; }

    @keyframes rotateClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateCounter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes idleHeart {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.035); }
      28% { transform: scale(1); }
      42% { transform: scale(1.022); }
      70% { transform: scale(1); }
    }
    @keyframes waveDance { from { height: 4px; } to { height: 15px; } }
    @keyframes recBlink {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>
</head>
<body>

  <canvas id="bg-particles"></canvas>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside id="history-drawer">
    <button type="button" class="new-chat-btn" id="new-session-btn">
      <span>+</span> Sesi Obrolan Baru
    </button>
    <div class="drawer-label">Riwayat Sesi</div>
    <div class="session-list" id="session-list"></div>

    <div class="drawer-footer">
      <div id="g-signin-box"></div>
      <div class="account-pill" id="account-pill" style="display:none;">
        <div class="account-info">
          <img id="drawer-avatar" src="" alt="User" />
          <span id="drawer-username" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
        </div>

      <button type="button" class="bar-icon" id="screen-btn" title="Share Screen">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>

        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

  <canvas id="capture-canvas" style="display:none;"></canvas>

  <script>
    const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const BACKEND_URL = isLocalHost
      ? window.location.origin
      : 'https://sterling-mesh-atmospheric-investigations.trycloudflare.com';
    const GSV_API_URL = 'https://sterling-mesh-atmospheric-investigations.trycloudflare.com';
    const SESSION_STORAGE_KEY = 'aira_session_histories_v1';
    const USER_CACHE_KEY = 'aira_google_user_v1';

    let currentLang = 'id';
    let visualMode = 'zafkiel';
    let muteAudio = true;
    let visionStream = null;
    let visionModeActive = null;
    let liveFrameTimer = null;
    let isListening = false;
    let currentSessionId = 'session_' + Date.now();
    let googleIdToken = localStorage.getItem('aira_google_token') || '';
    let cachedUserProfile = JSON.parse(localStorage.getItem(USER_CACHE_KEY) || 'null');
    let isVerifiedOwner = Boolean(cachedUserProfile?.isOwner);
    let cachedClientId = '';
    let sessionHistories = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || '{}');

    if (window.location.hash.includes('id_token=')) {
      const params = new URLSearchParams(window.location.hash.substring(1));
      const tokenFromUrl = params.get('id_token');
      if (tokenFromUrl) {
        googleIdToken = tokenFromUrl;
        localStorage.setItem('aira_google_token', googleIdToken);
      }
      history.replaceState(null, '', window.location.pathname);
    }

    const currentAudio = new Audio();
    currentAudio.crossOrigin = 'anonymous';

    const stateText = document.getElementById('state-text');
    const avatarCore = document.getElementById('avatar-core');
    const waveSpans = document.querySelectorAll('#wave-bars span');
    const userTranscriptBox = document.getElementById('user-transcript');
    const transcriptTextEl = document.getElementById('transcript-text');
    const recBadgeEl = document.getElementById('rec-badge');
    const recLabelEl = document.getElementById('rec-label');
    const airaSubtitle = document.getElementById('aira-subtitle');
    const airaSpeechSub = document.getElementById('aira-speech-sub');
    const visionBox = document.getElementById('vision-box');
    const visionVideo = document.getElementById('vision-video');
    const captureCanvas = document.getElementById('capture-canvas');
    const micBtn = document.getElementById('mic-btn');
    const stopBtn = document.getElementById('stop-btn');
    const audioToggleBtn = document.getElementById('audio-toggle');
    const profileBtn = document.getElementById('profile-btn');

    function setUserTranscript(text) {
      transcriptTextEl.textContent = text || '';
      const hasContent = Boolean(text) || recBadgeEl.classList.contains('active');
      userTranscriptBox.classList.toggle('visible', hasContent);
    }

    async function setOverlayState(active) {
      try {
        await fetch(`${BACKEND_URL}/api/overlay/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            active: Boolean(active),
            mode: active ? 'live' : 'idle'
          })
        });
      } catch (_) {}
    }

    function syncAudioToggleUI() {
      if (muteAudio) {
        audioToggleBtn.textContent = '🔇';
        audioToggleBtn.classList.add('muted');
        audioToggleBtn.title = 'Suara Web Dimatikan (Klik untuk Aktifkan)';
      } else {
        audioToggleBtn.textContent = '🔊';
        audioToggleBtn.classList.remove('muted');
        audioToggleBtn.title = 'Suara Web Aktif (Klik untuk Matikan)';
      }
    }

    function setRecAnimation(mode) {
      if (!mode) {
        recBadgeEl.classList.remove('active');
        recLabelEl.textContent = '';
        userTranscriptBox.classList.toggle('visible', Boolean(transcriptTextEl.textContent));
        return;
      }
      recBadgeEl.classList.add('active');
      recLabelEl.textContent = mode === 'recording' ? 'Merekam...' : 'Mengirim...';
      userTranscriptBox.classList.add('visible');
    }

    function applyUserProfileUI(profile) {
      if (!profile || (!profile.name && !profile.picture)) {
        profileBtn.innerHTML = 'G';
        document.getElementById('account-pill').style.display = 'none';
        document.getElementById('g-signin-box').style.display = 'block';
        return;
      }
      if (profile.picture) {
        profileBtn.innerHTML = `<img src="${profile.picture}" alt="Profil" />`;
        document.getElementById('drawer-avatar').src = profile.picture;
      } else {
        const initial = (profile.name || 'G').charAt(0).toUpperCase();
        profileBtn.textContent = initial;
        document.getElementById('drawer-avatar').removeAttribute('src');
      }
      document.getElementById('drawer-username').textContent = profile.name || 'Akun Google';
      document.getElementById('account-pill').style.display = 'flex';
      document.getElementById('g-signin-box').style.display = 'none';
    }

    if (googleIdToken && cachedUserProfile) {
      applyUserProfileUI(cachedUserProfile);
    }

    const rightDrawer = document.getElementById('right-chat-drawer');
    const rightBackdrop = document.getElementById('right-drawer-backdrop');
    const rightHandle = document.getElementById('right-drawer-handle');
    const rightCloseBtn = document.getElementById('right-drawer-close');
    const sessionChatLogEl = document.getElementById('session-chat-log');
    const rightDrawerTitle = document.getElementById('right-drawer-title');
    let isRightDrawerOpen = false;

    function saveSessionHistories() {
      try {
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessionHistories));
      } catch (_) {}
    }

    function setRightDrawerOpen(open) {
      isRightDrawerOpen = open;
      rightDrawer.classList.remove('dragging');
      rightDrawer.style.transform = '';
      rightDrawer.classList.toggle('open', open);
      rightBackdrop.classList.toggle('open', open);
      rightHandle.textContent = open ? '⟩' : '⟨';
      if (open) renderCurrentSessionChat();
    }

    function appendSessionMessage(sessionId, role, text) {
      if (!text) return;
      if (!Array.isArray(sessionHistories[sessionId])) {
        sessionHistories[sessionId] = [];
      }
      sessionHistories[sessionId].push({ role, text, time: Date.now() });
      saveSessionHistories();
      if (sessionId === currentSessionId) {
        renderCurrentSessionChat();
      }
    }

    function renderCurrentSessionChat() {
      const list = sessionHistories[currentSessionId] || [];
      rightDrawerTitle.textContent = `Sesi (${list.length} pesan)`;
      sessionChatLogEl.innerHTML = '';

      if (list.length === 0) {
        sessionChatLogEl.innerHTML = '<div style="font-size:0.74rem;color:#9e8a92;padding:8px;text-align:center;">Belum ada pesan di sesi ini.</div>';
        return;
      }

      list.forEach((m) => {
        const item = document.createElement('div');
        item.className = `chat-bubble-item ${m.role === 'user' ? 'user' : 'ai'}`;
        item.innerHTML = `<span class="chat-bubble-role">${m.role === 'user' ? 'Kamu' : 'Aira'}</span>${m.text}`;
        sessionChatLogEl.appendChild(item);
      });
      sessionChatLogEl.scrollTop = sessionChatLogEl.scrollHeight;
    }

    let dragStartX = null;
    let dragCurrentDelta = 0;
    let isDraggingDrawer = false;

    function onPointerDownDrawer(e) {
      dragStartX = e.clientX;
      dragCurrentDelta = 0;
      isDraggingDrawer = true;
      rightDrawer.classList.add('dragging');
    }

    function onPointerMoveDrawer(e) {
      if (!isDraggingDrawer || dragStartX === null) return;
      const dx = e.clientX - dragStartX;
      const width = rightDrawer.offsetWidth || 272;

      if (!isRightDrawerOpen) {
        const clamped = Math.max(-width, Math.min(0, dx));
        dragCurrentDelta = clamped;
        rightDrawer.style.transform = `translateX(${width + clamped}px)`;
      } else {
        const clamped = Math.max(0, Math.min(width, dx));
        dragCurrentDelta = clamped;
        rightDrawer.style.transform = `translateX(${clamped}px)`;
      }
    }

    function onPointerUpDrawer() {
      if (!isDraggingDrawer) return;
      isDraggingDrawer = false;
      rightDrawer.classList.remove('dragging');
      rightDrawer.style.transform = '';

      if (!isRightDrawerOpen && dragCurrentDelta < -45) {
        setRightDrawerOpen(true);
      } else if (isRightDrawerOpen && dragCurrentDelta > 45) {
        setRightDrawerOpen(false);
      } else {
        setRightDrawerOpen(isRightDrawerOpen);
      }
      dragStartX = null;
      dragCurrentDelta = 0;
    }

    rightHandle.addEventListener('pointerdown', onPointerDownDrawer);
    rightDrawer.addEventListener('pointerdown', (e) => {
      if (e.target === rightDrawer || e.target === rightHandle) onPointerDownDrawer(e);
    });
    window.addEventListener('pointermove', onPointerMoveDrawer);
    window.addEventListener('pointerup', onPointerUpDrawer);

    rightHandle.addEventListener('click', () => {
      if (Math.abs(dragCurrentDelta) < 6) setRightDrawerOpen(!isRightDrawerOpen);
    });
    rightCloseBtn.addEventListener('click', () => setRightDrawerOpen(false));
    rightBackdrop.addEventListener('click', () => setRightDrawerOpen(false));

    function updateStopButtonVisibility() {
      const hasVision = Boolean(visionStream);
      const isPlayingAudio = !currentAudio.paused && !currentAudio.ended;
      stopBtn.classList.toggle('visible', hasVision || isPlayingAudio);
    }

    function handleGoogleCredentialResponse(response) {
      if (!response || !response.credential) return;
      googleIdToken = response.credential;
      localStorage.setItem('aira_google_token', googleIdToken);
      syncServerConfig(true);
    }

    function initGoogleIdentity(clientId) {
      cachedClientId = clientId || cachedClientId;
      if (!cachedClientId || !window.google || !google.accounts || !google.accounts.id) return;

      google.accounts.id.initialize({
        client_id: cachedClientId,
        callback: handleGoogleCredentialResponse,
        use_fedcm_for_prompt: false
      });

      const box = document.getElementById('g-signin-box');
      if (box && !googleIdToken) {
        box.innerHTML = '';
        google.accounts.id.renderButton(box, {
          theme: 'filled_black',
          size: 'large',
          shape: 'pill',
          text: 'signin_with',
          width: 240
        });
      }
    }

    profileBtn.addEventListener('click', () => {
      if (googleIdToken && cachedUserProfile) {
        const label = cachedUserProfile.name || 'Akun Google';
        airaSubtitle.textContent = `Masuk sebagai ${label}.`;
        return;
      }

      if (!cachedClientId) {
        airaSubtitle.textContent = 'Google Login belum siap: GOOGLE_CLIENT_ID belum terbaca dari server.';
        return;
      }

      if (window.google && google.accounts && google.accounts.id) {
        try {
          initGoogleIdentity(cachedClientId);
          google.accounts.id.prompt();
        } catch (_) {}
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      googleIdToken = '';
      cachedUserProfile = null;
      isVerifiedOwner = false;
      localStorage.removeItem('aira_google_token');
      localStorage.removeItem(USER_CACHE_KEY);
      applyUserProfileUI(null);
      initGoogleIdentity(cachedClientId);
      airaSubtitle.textContent = 'Kamu telah keluar. Mode Tamu aktif.';
      toggleDrawer(false);
    });

    async function syncServerConfig(justLoggedIn = false) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/live-config`, {
          headers: googleIdToken ? { 'x-google-token': googleIdToken } : {}
        });
        if (!res.ok) return;
        const cfg = await res.json();

        if (cfg.googleClientId) {
          cachedClientId = cfg.googleClientId;
          setTimeout(() => initGoogleIdentity(cfg.googleClientId), 300);
        }

        isVerifiedOwner = Boolean(cfg.isOwner);
        if (googleIdToken && (cfg.userName || cfg.userPicture)) {
          cachedUserProfile = {
            name: cfg.userName || 'Akun Google',
            picture: cfg.userPicture || null,
            isOwner: isVerifiedOwner
          };
          localStorage.setItem(USER_CACHE_KEY, JSON.stringify(cachedUserProfile));
          applyUserProfileUI(cachedUserProfile);
        } else if (!googleIdToken) {
          cachedUserProfile = null;
          localStorage.removeItem(USER_CACHE_KEY);
          applyUserProfileUI(null);
        }

        if (justLoggedIn) {
          airaSubtitle.textContent = isVerifiedOwner
            ? 'Ara, selamat datang kembali, Neruru~ Ruang khusus kita sudah terbuka.'
            : `Halo ${cfg.userName || 'Tamu'}, senang bertemu denganmu. Ada yang bisa Aira bantu?`;
        } else if (isVerifiedOwner && !googleIdToken) {
          airaSubtitle.textContent = 'Ara, akhirnya kamu membuka ruang khusus untuk kita berdua, Neruru~';
        }

        syncAudioToggleUI();
        if (cfg.language) setLanguageUI(cfg.language, false);
        renderCurrentSessionChat();
      } catch (_) {
        if (googleIdToken && cachedUserProfile) {
          applyUserProfileUI(cachedUserProfile);
        }
      }
    }

    const drawer = document.getElementById('history-drawer');
    const backdrop = document.getElementById('sidebar-backdrop');
    const sessionListEl = document.getElementById('session-list');

    function toggleDrawer(open) {
      drawer.classList.toggle('open', open);
      backdrop.classList.toggle('open', open);
      if (open) {
        if (googleIdToken && cachedUserProfile) applyUserProfileUI(cachedUserProfile);
        loadSessionsList();
      }
    }

    document.getElementById('menu-btn').addEventListener('click', () => toggleDrawer(true));
    backdrop.addEventListener('click', () => toggleDrawer(false));

    document.getElementById('new-session-btn').addEventListener('click', () => {
      currentSessionId = 'session_' + Date.now();
      if (!Array.isArray(sessionHistories[currentSessionId])) {
        sessionHistories[currentSessionId] = [];
        saveSessionHistories();
      }
      setUserTranscript('');
      setRecAnimation(null);
      airaSubtitle.textContent = isVerifiedOwner
        ? 'Sesi baru dimulai, Neruru~ Tenang saja, Aira tetap mengingat semua cerita kita sebelumnya.'
        : 'Sesi obrolan baru dimulai. Silakan sampaikan pertanyaanmu.';
      airaSpeechSub.style.display = 'none';
      renderCurrentSessionChat();
      toggleDrawer(false);
    });

    async function loadSessionsList() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/sessions`, {
          headers: googleIdToken ? { 'x-google-token': googleIdToken } : {}
        });
        const data = await res.json();
        sessionListEl.innerHTML = '';
        if (!isVerifiedOwner) {
          sessionListEl.innerHTML = '<div style="font-size:0.76rem;color:#9e8a92;padding:8px;">Masuk dengan akun Google Neruru untuk melihat riwayat sesi tersimpan.</div>';
          return;
        }
        if (!data.sessions || data.sessions.length === 0) {
          sessionListEl.innerHTML = '<div style="font-size:0.76rem;color:#77666d;padding:8px;">Belum ada riwayat sesi tersimpan.</div>';
          return;
        }
        data.sessions.forEach(s => {
          const item = document.createElement('div');
          item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
          item.textContent = s.title || 'Obrolan dengan Aira';
          item.addEventListener('click', () => openSession(s.id));
          sessionListEl.appendChild(item);
        });
      } catch (_) {}
    }

    async function openSession(id) {
      try {
        const res = await fetch(`${BACKEND_URL}/api/sessions/${id}`, {
          headers: googleIdToken ? { 'x-google-token': googleIdToken } : {}
        });
        const data = await res.json();
        if (!data.session) return;
        currentSessionId = id;
        const msgs = data.session.messages || [];
        if (msgs.length > 0) {
          sessionHistories[id] = msgs.map((m) => ({
            role: m.role === 'user' ? 'user' : 'ai',
            text: m.text,
            time: Date.now()
          }));
          saveSessionHistories();
        }
        const lastUser = [...msgs].reverse().find(m => m.role === 'user');
        const lastAi = [...msgs].reverse().find(m => m.role === 'ai');
        setUserTranscript(lastUser ? `Kamu: "${lastUser.text}"` : '');
        airaSubtitle.textContent = lastAi ? lastAi.text : 'Sesi dimuat.';
        renderCurrentSessionChat();
        toggleDrawer(false);
      } catch (_) {}
    }

    // ==========================================
    // LIVE2D RENDERER (HALF-BODY, EYE/HEAD/BODY TRACKING & LIP-SYNC)
    // ==========================================
    let live2dApp = null;
    let live2dModel = null;
    let mouthAnimFrame = null;
    let audioCtx = null;
    let analyserNode = null;

    function setupLive2DLipSync() {
      if (analyserNode) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(currentAudio);
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 256;
        source.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);
      } catch (e) {
        console.warn('Lip-sync audio analyser dilewati:', e.message);
      }
    }

    function startMouthSyncLoop() {
      if (!analyserNode || !live2dModel) return;
      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);

      function tick() {
        if (currentAudio.paused || currentAudio.ended) {
          try {
            live2dModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', 0);
          } catch (_) {}
          return;
        }
        analyserNode.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < 24; i++) sum += dataArray[i];
        const volume = Math.min(1, (sum / 24 / 140) * 1.4);

        try {
          live2dModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', volume);
        } catch (_) {}
        mouthAnimFrame = requestAnimationFrame(tick);
      }
      cancelAnimationFrame(mouthAnimFrame);
      tick();
    }

    async function initLive2DModel() {
      if (live2dModel) return;
      const canvasEl = document.getElementById('live2d-canvas');
      const placeholderEl = document.getElementById('live2d-placeholder');

      if (!window.PIXI || !PIXI.live2d) {
        placeholderEl.innerHTML = '<strong>Library Live2D Belum Siap</strong>Periksa koneksi internet untuk memuat Cubism SDK.';
        return;
      }

      try {
        placeholderEl.style.position = 'fixed';
        placeholderEl.style.left = '50%';
        placeholderEl.style.top = '32%';
        placeholderEl.style.transform = 'translate(-50%, -50%)';
        placeholderEl.innerHTML = '<strong>Memuat Model...</strong>Sedang merender Tokisaki Kurumi...';

        live2dApp = new PIXI.Application({
          view: canvasEl,
          autoStart: true,
          backgroundAlpha: 0,
          resizeTo: window
        });

        const baseModelUrl = isLocalHost
          ? '/models/Tokisaki Kurumi.model3.json'
          : `${BACKEND_URL}/models/Tokisaki Kurumi.model3.json`;

        live2dModel = await PIXI.live2d.Live2DModel.from(encodeURI(baseModelUrl), {
          autoInteract: false
        });

        const fitModel = () => {
          if (!live2dModel) return;
          const w = window.innerWidth;
          const h = window.innerHeight;
          const isLandscape = w > h && w >= 768;

          const modelHeight = live2dModel.internalModel?.height || live2dModel.height || 1000;
          const scale = isLandscape ? (h * 1.75) / modelHeight : (h * 1.45) / modelHeight;

          live2dModel.scale.set(scale);
          live2dModel.anchor.set(0.5, 0.28);
          live2dModel.x = isLandscape ? w * 0.32 : w * 0.5;
          live2dModel.y = isLandscape ? h * 0.54 : h * 0.46;
        };

        fitModel();
        window.addEventListener('resize', fitModel);

        // Tracking mata, kepala, dan badan berdasarkan koordinat mata Kurumi di layar
        let targetX = 0;
        let targetY = 0;
        let currentEyeX = 0;
        let currentEyeY = 0;
        let currentBodyX = 0;
        let currentBodyY = 0;

        window.addEventListener('pointermove', (e) => {
          if (!live2dModel || visualMode !== 'live2d') return;
          const w = window.innerWidth;
          const h = window.innerHeight;
          const isLandscape = w > h && w >= 768;

          const eyeOriginX = isLandscape ? w * 0.32 : w * 0.5;
          const eyeOriginY = isLandscape ? h * 0.34 : h * 0.30;

          const dx = (e.clientX - eyeOriginX) / (w * 0.45);
          const dy = (eyeOriginY - e.clientY) / (h * 0.32);

          targetX = Math.max(-1, Math.min(1, dx));
          targetY = Math.max(-1, Math.min(1, dy));
        });

        live2dApp.ticker.add(() => {
          if (!live2dModel || visualMode !== 'live2d') return;
          currentEyeX += (targetX - currentEyeX) * 0.18;
          currentEyeY += (targetY - currentEyeY) * 0.18;
          currentBodyX += (targetX - currentBodyX) * 0.08;
          currentBodyY += (targetY - currentBodyY) * 0.08;

          try {
            const core = live2dModel.internalModel.coreModel;
            core.setParameterValueById('ParamEyeBallX', currentEyeX);
            core.setParameterValueById('ParamEyeBallY', currentEyeY);
            core.setParameterValueById('ParamAngleX', currentEyeX * 22);
            core.setParameterValueById('ParamAngleY', currentEyeY * 18);
            core.setParameterValueById('ParamAngleZ', currentEyeX * -6);
            core.setParameterValueById('ParamBodyAngleX', currentBodyX * 8);
            core.setParameterValueById('ParamBodyAngleY', currentBodyY * 5);
            core.setParameterValueById('ParamBodyAngleZ', currentBodyX * -3);
          } catch (_) {}
        });

        live2dApp.stage.addChild(live2dModel);
        placeholderEl.style.display = 'none';
        setupLive2DLipSync();
      } catch (err) {
        console.error('Gagal memuat Live2D:', err);
        placeholderEl.innerHTML = `<strong>Gagal Memuat Model</strong>${err.message || 'Cek Console (F12)'}`;
      }
    }

    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        visualMode = btn.dataset.mode;
        document.body.classList.toggle('mode-live2d', visualMode === 'live2d');
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === visualMode));
        document.getElementById('zafkiel-stage').style.display = visualMode === 'zafkiel' ? 'flex' : 'none';
        document.getElementById('live2d-stage').style.display = visualMode === 'live2d' ? 'flex' : 'none';

        if (visualMode === 'live2d') {
          initLive2DModel();
        }
      });
    });

    function stopHeartbeatPulse() {
      avatarCore.style.transform = '';
      avatarCore.style.boxShadow = '';
      waveSpans.forEach(bar => (bar.style.height = '5px'));
      avatarCore.classList.add('idle-heartbeat');
      updateStopButtonVisibility();
    }

    currentAudio.addEventListener('play', () => {
      avatarCore.classList.remove('idle-heartbeat');
      avatarCore.classList.add('listening');
      waveSpans.forEach((bar, i) => {
        bar.style.height = `${8 + ((i * 3) % 8)}px`;
      });
      stateText.textContent = 'Aira Berbicara...';
      updateStopButtonVisibility();

      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      startMouthSyncLoop();
    });

    currentAudio.addEventListener('ended', () => {
      avatarCore.classList.remove('listening');
      stopHeartbeatPulse();
      stateText.textContent = 'Menunggu Perintah';
    });

    function renderClockNumerals() {
      const clockRing = document.getElementById('clock-ring');
      clockRing.innerHTML = '';
      const size = clockRing.offsetWidth || 250;
      const center = size / 2;
      const radius = center - 16;
      const numerals = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
      numerals.forEach((num, idx) => {
        const angle = (idx * 30 - 90) * (Math.PI / 180);
        const el = document.createElement('span');
        el.className = 'roman-num';
        el.textContent = num;
        el.style.left = `${center + radius * Math.cos(angle) - 12}px`;
        el.style.top = `${center + radius * Math.sin(angle) - 9}px`;
        clockRing.appendChild(el);
      });
    }
    window.addEventListener('resize', renderClockNumerals);
    renderClockNumerals();

    const pCanvas = document.getElementById('bg-particles');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];
    function resizeParticles() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeParticles);
    resizeParticles();

    for (let i = 0; i < 22; i++) {
      particles.push({
        x: Math.random() * pCanvas.width,
        y: Math.random() * pCanvas.height,
        r: Math.random() * 2 + 0.8,
        vy: -(Math.random() * 0.35 + 0.15),
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      particles.forEach(p => {
        p.y += p.vy;
        if (p.y < 0) p.y = pCanvas.height;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(217, 4, 41, ${p.alpha})`;
        pCtx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    audioToggleBtn.addEventListener('click', () => {
      muteAudio = !muteAudio;
      if (muteAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        stopHeartbeatPulse();
        stateText.textContent = 'Menunggu Perintah';
      }
      syncAudioToggleUI();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    function setLanguageUI(lang, showNotice = true) {
      currentLang = lang;
      document.querySelectorAll('[data-lang]').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      if (recognition) {
        recognition.lang = lang === 'ja' ? 'ja-JP' : lang === 'en' ? 'en-US' : 'id-ID';
      }
      if (showNotice) {
        const label = lang === 'ja' ? 'Bahasa Jepang (JP)' : lang === 'en' ? 'Bahasa Inggris (EN)' : 'Bahasa Indonesia (ID)';
        stateText.textContent = `Mode: ${label}`;
      }
    }

    document.querySelectorAll('[data-lang]').forEach(btn => {
      btn.addEventListener('click', () => setLanguageUI(btn.dataset.lang, true));
    });

    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('chat-input');
      if (!input.value.trim()) return;
      sendToAira(input.value.trim(), false);
      input.value = '';
    });

    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('send-btn').click();
    });

    async function syncLiveFrame() {
      const frame = grabFrameBase64();
      if (!frame) return;
      try {
        await fetch(`${BACKEND_URL}/api/live-talk`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(googleIdToken ? { 'x-google-token': googleIdToken } : {})
          },
          body: JSON.stringify({
            text: '[LIVE_FRAME_SYNC]',
            imageBase64: frame,
            sessionId: currentSessionId,
            googleToken: googleIdToken,
            muteAudio: true,
            disableVoice: true,
            silentFrame: true
          })
        });
      } catch (_) {}
    }

    async function startVision(mode) {
      stopVision();
      try {
        visionStream = mode === 'camera'
          ? await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          : await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });

        visionModeActive = mode;
        visionVideo.srcObject = visionStream;
        visionBox.style.display = 'block';
        document.getElementById(mode === 'camera' ? 'cam-btn' : 'screen-btn').classList.add('active');
        updateStopButtonVisibility();

        if (mode === 'screen') {
          await setOverlayState(true);
          stateText.textContent = 'Mode Overlay Live Aktif';
          liveFrameTimer = setInterval(syncLiveFrame, 4000);
        }

        const track = visionStream.getVideoTracks()[0];
        if (track) {
          track.addEventListener('ended', () => {
            stopVision();
            stateText.textContent = 'Menunggu Perintah';
          });
        }
      } catch (err) {
        alert('Izin kamera/layar ditolak atau tidak didukung browser ini.');
      }
    }

    function stopVision() {
      const wasScreen = visionModeActive === 'screen';
      if (liveFrameTimer) {
        clearInterval(liveFrameTimer);
        liveFrameTimer = null;
      }
      if (visionStream) {
        visionStream.getTracks().forEach(t => t.stop());
        visionStream = null;
      }
      visionModeActive = null;
      visionBox.style.display = 'none';
      document.getElementById('cam-btn').classList.remove('active');
      document.getElementById('screen-btn').classList.remove('active');
      updateStopButtonVisibility();
      if (wasScreen) {
        setOverlayState(false);
      }
    }

    function grabFrameBase64() {
      if (!visionStream || visionVideo.videoWidth === 0) return null;
      captureCanvas.width = 640;
      captureCanvas.height = Math.round((visionVideo.videoHeight / visionVideo.videoWidth) * 640);
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(visionVideo, 0, 0, captureCanvas.width, captureCanvas.height);
      return captureCanvas.toDataURL('image/jpeg', 0.72);
    }

    document.getElementById('cam-btn').addEventListener('click', () => {
      if (document.getElementById('cam-btn').classList.contains('active')) stopVision();
      else startVision('camera');
    });

    document.getElementById('screen-btn').addEventListener('click', () => {
      if (document.getElementById('screen-btn').classList.contains('active')) stopVision();
      else startVision('screen');
    });

    stopBtn.addEventListener('click', () => {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      stopHeartbeatPulse();
      avatarCore.classList.remove('listening');
      stopVision();
      stateText.textContent = 'Menunggu Perintah';
    });

    if (recognition) {
      recognition.lang = 'id-ID';
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        avatarCore.classList.add('listening');
        setRecAnimation('recording');
        stateText.textContent = 'Mendengarkan...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        isListening = false;
        micBtn.classList.remove('listening');
        avatarCore.classList.remove('listening');
        try { recognition.stop(); } catch (_) {}
        if (transcript) {
          sendToAira(transcript, true);
        } else {
          setRecAnimation(null);
          stateText.textContent = 'Menunggu Perintah';
        }
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        avatarCore.classList.remove('listening');
        setRecAnimation(null);
        stateText.textContent = 'Menunggu Perintah';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        avatarCore.classList.remove('listening');
        if (recLabelEl.textContent === 'Merekam...') {
          setRecAnimation(null);
        }
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('Browser ini belum mendukung mic langsung. Gunakan kolom ketik di sampingnya.');
        return;
      }
      if (isListening) {
        isListening = false;
        micBtn.classList.remove('listening');
        avatarCore.classList.remove('listening');
        setRecAnimation(null);
        try { recognition.stop(); } catch (_) {}
        stateText.textContent = 'Menunggu Perintah';
      } else {
        recognition.lang = currentLang === 'ja' ? 'ja-JP' : currentLang === 'en' ? 'en-US' : 'id-ID';
        try {
          recognition.start();
        } catch (_) {
          isListening = false;
          micBtn.classList.remove('listening');
          avatarCore.classList.remove('listening');
          setRecAnimation(null);
        }
      }
    });

    async function sendToAira(text, fromVoice = false) {
      setUserTranscript(`Kamu: "${text}"`);
      if (fromVoice) {
        setRecAnimation('sending');
      }
      appendSessionMessage(currentSessionId, 'user', text);
      stateText.textContent = 'Memproses Waktu...';
      const frame = grabFrameBase64();

      try {
        const res = await fetch(`${BACKEND_URL}/api/live-talk`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(googleIdToken ? { 'x-google-token': googleIdToken } : {})
          },
          body: JSON.stringify({
            text,
            imageBase64: frame,
            lang: currentLang,
            muteAudio,
            disableVoice: muteAudio,
            gsvApiUrl: GSV_API_URL,
            sessionId: currentSessionId,
            googleToken: googleIdToken
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const mainReply = data.subtitle || data.speech;
        airaSubtitle.textContent = mainReply;

        let historyReply = mainReply;
        if (currentLang !== 'id' && data.speech && data.speech !== data.subtitle) {
          airaSpeechSub.style.display = 'block';
          airaSpeechSub.textContent = data.speech;
          historyReply = `${mainReply} (${data.speech})`;
        } else {
          airaSpeechSub.style.display = 'none';
        }

        appendSessionMessage(currentSessionId, 'ai', historyReply);

        if (!muteAudio && data.audioBase64) {
          currentAudio.src = data.audioBase64.startsWith('data:')
            ? data.audioBase64
            : `data:audio/wav;base64,${data.audioBase64}`;
          currentAudio.play().catch(() => {
            stopHeartbeatPulse();
            stateText.textContent = 'Menunggu Perintah';
          });
        } else {
          currentAudio.pause();
          stopHeartbeatPulse();
          stateText.textContent = 'Menunggu Perintah';
        }

        setRecAnimation(null);
      } catch (err) {
        const errMsg = 'Maaf, koneksi Aira terganggu sebentar...';
        airaSubtitle.textContent = errMsg;
        appendSessionMessage(currentSessionId, 'ai', errMsg);
        setRecAnimation(null);
        stateText.textContent = 'Terputus';
      }
    }

    window.addEventListener('load', () => {
      syncAudioToggleUI();
      syncServerConfig(false);
    });
  </script>
</body>
</html>
